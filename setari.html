<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setări – Hrana pentru suflet</title>

    <!-- Manifest + Service Worker -->
    <link rel="manifest" href="manifest.json">
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js");
        }
    </script>

    <!-- Font Awesome pentru iconițe -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Stiluri premium -->
    <link rel="stylesheet" href="style.css2">
</head>

<body>

<header class="header">
    <h1>Setări</h1>
</header>

<main class="container">

    <!-- Mărime text -->
    <section class="card">
        <h2><i class="fas fa-text-height"></i> Mărime text</h2>
        <input type="range" id="fontRange" min="14" max="30" value="18">
        <p id="fontValue">Mărime actuală: 18px</p>
    </section>

    <!-- Tema aplicației -->
    <section class="card">
        <h2><i class="fas fa-palette"></i> Tema aplicației</h2>
        <select id="themeSelect" class="select-premium">
            <option value="light">Luminos</option>
            <option value="dark">Întunecat</option>
            <option value="sepia">Sepia</option>
        </select>
    </section>

    <!-- Citire automată -->
    <section class="card">
        <h2><i class="fas fa-volume-up"></i> Citire automată</h2>
        <button id="toggleVoice" class="btn-premium">
            <i class="fas fa-play"></i> Activează citirea
        </button>
    </section>

    <!-- Resetare setări -->
    <section class="card">
        <h2><i class="fas fa-undo"></i> Resetare setări</h2>
        <button id="resetBtn" class="btn-premium">
            <i class="fas fa-trash"></i> Resetează tot
        </button>
    </section>

    <!-- Înapoi -->
    <a href="index.html" class="btn-premium">
        <i class="fas fa-arrow-left"></i> Înapoi la meniu
    </a>

</main>

<script>
    // Slider mărime text
    const fontRange = document.getElementById("fontRange");
    const fontValue = document.getElementById("fontValue");

    fontRange.addEventListener("input", () => {
        fontValue.textContent = "Mărime actuală: " + fontRange.value + "px";
        document.body.style.fontSize = fontRange.value + "px";
    });

    // Tema aplicației
    const themeSelect = document.getElementById("themeSelect");
    themeSelect.addEventListener("change", () => {
        document.body.setAttribute("data-theme", themeSelect.value);
    });

    // Citire automată
    const toggleVoice = document.getElementById("toggleVoice");
    toggleVoice.addEventListener("click", () => {
        alert("Funcția de citire automată va fi activată în versiunea APK.");
    });

    // Resetare setări
    const resetBtn = document.getElementById("resetBtn");
    resetBtn.addEventListener("click", () => {
        fontRange.value = 18;
        fontValue.textContent = "Mărime actuală: 18px";
        document.body.style.fontSize = "18px";
        themeSelect.value = "light";
        document.body.setAttribute("data-theme", "light");
        alert("Setările au fost resetate.");
    });
</script>

</body>
</html>
