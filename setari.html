<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setări – Hrana pentru suflet</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Stiluri premium -->
    <link rel="stylesheet" href="style.css2">

    <style>
        /* Card premium */
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .setting-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .slider {
            width: 100%;
        }

        .select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--btn-bg);
            color: var(--text);
            font-size: 1rem;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 12px;
            background: var(--btn-bg);
            color: var(--text);
            border: none;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: var(--shadow);
        }
    </style>
</head>

<body>

<header class="header">
    Setări
</header>

<main class="container">

    <!-- 🔹 Mărimea textului -->
    <div class="card scroll-appear">
        <div class="setting-title"><i class="fas fa-text-height"></i> Mărimea textului</div>
        <input type="range" id="fontSize" min="14" max="28" value="18" class="slider">
    </div>

    <!-- 🔹 Selectare voce TTS -->
    <div class="card scroll-appear">
        <div class="setting-title"><i class="fas fa-microphone"></i> Selectează vocea</div>
        <select id="voiceSelect" class="select"></select>
    </div>

    <!-- 🔹 Citire automată -->
    <div class="card scroll-appear">
        <div class="setting-title"><i class="fas fa-volume-high"></i> Citire automată</div>
        <button class="btn-action" onclick="testVoice()">Testează vocea</button>
    </div>

    <!-- 🔹 Mod întunecat -->
    <div class="card scroll-appear">
        <div class="setting-title"><i class="fas fa-moon"></i> Mod întunecat</div>
        <button class="btn-action" onclick="toggleDark()">Comută mod întunecat</button>
    </div>
<!-- 🔹 Citire cu voce (cu sub-meniu) -->
<div class="card scroll-appear">
    <div class="setting-title"><i class="fas fa-volume-up"></i> Citire cu voce</div>

    <button class="btn-action" onclick="toggleReadMenu()">
        <i class="fas fa-chevron-down"></i> Afișează opțiunile
    </button>

    <div id="readMenu" style="display:none; margin-top:15px;">

        <button class="btn-action" onclick="readSelection()">
            <i class="fas fa-highlighter"></i> Citește textul selectat
        </button>

        <button class="btn-action" onclick="readPage()">
            <i class="fas fa-file-alt"></i> Citește toată pagina
        </button>

        <button class="btn-action" onclick="readSection()">
            <i class="fas fa-align-left"></i> Citește secțiunea curentă
        </button>

    </div>
</div>

    <!-- 🔹 Resetare setări -->
    <div class="card scroll-appear">
        <div class="setting-title"><i class="fas fa-rotate-left"></i> Resetare setări</div>
        <button class="btn-action" onclick="resetSettings()">Resetează tot</button>
    </div>

</main>

<footer class="footer">
    Slavă lui Dumnezeu pentru toate!  
    <br>© 2026 Hrana pentru suflet
</footer>

<script>
/* 🌙 Dark mode */
function toggleDark() {
    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}

if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
}

/* 🔊 Text-to-Speech */
let voices = [];

function loadVoices() {
    voices = speechSynthesis.getVoices();
    const select = document.getElementById("voiceSelect");
    select.innerHTML = "";

    voices.forEach((voice, i) => {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = voice.name + " (" + voice.lang + ")";
        select.appendChild(option);
    });
}

speechSynthesis.onvoiceschanged = loadVoices;

function testVoice() {
    const msg = new SpeechSynthesisUtterance("Aceasta este o probă de voce.");
    msg.voice = voices[document.getElementById("voiceSelect").value];
    speechSynthesis.speak(msg);
}

/* 🔤 Mărimea textului */
const fontSlider = document.getElementById("fontSize");
fontSlider.addEventListener("input", () => {
    document.documentElement.style.fontSize = fontSlider.value + "px";
    localStorage.setItem("fontSize", fontSlider.value);
});

if (localStorage.getItem("fontSize")) {
    fontSlider.value = localStorage.getItem("fontSize");
    document.documentElement.style.fontSize = fontSlider.value + "px";
}

/* ♻ Resetare */
function resetSettings() {
    localStorage.clear();
    location.reload();
}

/* ✨ Scroll animations */
document.addEventListener("DOMContentLoaded", () => {
    const elements = document.querySelectorAll(".scroll-appear");

    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (entry.isIntersecting) entry.target.classList.add("visible");
        });
    }, { threshold: 0.2 });

    elements.forEach(el => observer.observe(el));
});
</script>

</body>
</html>
