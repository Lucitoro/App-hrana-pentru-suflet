<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setări — Premium</title>
<link rel="stylesheet" href="style.css2?v=3">

<style>
/* TITLU PREMIUM */
h1 {
    text-align: center;
    color: gold;
    text-shadow: 0 0 15px gold;
    margin-bottom: 25px;
    font-size: 28px;
}

/* CONTAINER BUTOANE */
.section {
    padding: 20px;
}

/* BUTOANE PREMIUM CU CRUCE VIZIBILĂ */
.section button {
    width: 100%;
    padding: 15px;
    margin-bottom: 12px;
    font-size: 20px;
    border-radius: 12px;
    border: 2px solid gold;
    background: linear-gradient(145deg, #111, #222);
    color: gold;
    font-weight: bold;
    box-shadow: 0 0 12px gold;
    transition: 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
}

/* CRUCE PREMIUM AURIE */
.section button::before {
    content: "✝️";
    font-size: 24px;
    filter: drop-shadow(0 0 6px gold);
}

.section button:hover {
    background: gold;
    color: black;
    box-shadow: 0 0 25px gold;
    transform: scale(1.05);
}

/* SUBMENIU DESCĂRCARE */
.submenu {
    display: none;
    animation: fadeIn 0.4s ease-in-out;
}

.submenu button {
    background: #000;
    border: 1px solid gold;
    color: gold;
    margin-top: 10px;
}

.submenu button:hover {
    background: gold;
    color: black;
}

/* ANIMAȚIE */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(-10px);}
    to {opacity: 1; transform: translateY(0);}
}

/* NAVIGAȚIE JOS PREMIUM */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #000;
    border-top: 2px solid gold;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
}

.nav-btn {
    background: none;
    border: none;
    color: gold;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 0 10px gold;
}

.nav-btn.active {
    color: white;
    text-shadow: 0 0 15px white;
}
</style>
</head>

<body>

<h1>⚙️ Setări Premium</h1>

<div class="section">

    <button onclick="changeTextSize(1)">Mărire text</button>
    <button onclick="changeTextSize(-1)">Micșorare text</button>
    <button onclick="toggleDarkMode()">Mod întunecat / lumină</button>
    <button onclick="speakText()">Citește textul (TTS)</button>

    <!-- BUTON DESCĂRCARE PREMIUM -->
    <button onclick="toggleSubmenu()">Descarcă aplicația</button>

    <!-- SUBMENIU PREMIUM -->
    <div id="downloadMenu" class="submenu">
        <button onclick="location.href='app.apk'">📱 Descarcă APK</button>
        <button onclick="installPWA()">📲 Instalează PWA</button>
        <button onclick="location.href='document.pdf'">📄 Descarcă PDF</button>
        <button onclick="location.href='fisier.zip'">📦 Alt fișier</button>
    </div>

</div>

<p style="text-align:center; color:gold; margin-bottom:80px;">Versiunea 2.0 — Premium Edition ✝️</p>

<div class="bottom-nav">
    <button class="nav-btn" onclick="location.href='index.html'">Acasă</button>
    <button class="nav-btn" onclick="location.href='calendar.html'">Calendar</button>
    <button class="nav-btn" onclick="location.href='rugaciuni.html'">Rugăciuni</button>
    <button class="nav-btn active" onclick="location.href='setari.html'">Setări</button>
</div>

<script>
function changeTextSize(amount) {
    document.body.style.fontSize =
        (parseInt(window.getComputedStyle(document.body).fontSize) + amount) + "px";
}

function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
}

function speakText() {
    const msg = new SpeechSynthesisUtterance(document.body.innerText);
    window.speechSynthesis.speak(msg);
}

function toggleSubmenu() {
    const menu = document.getElementById("downloadMenu");
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

function installPWA() {
    alert("Instalarea PWA va funcționa după ce adăugăm manifest.json și service worker.");
}
</script>

</body>
</html>
