<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setări</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>⚙️ SETĂRI APLICAȚIE</h1>

<!-- Mărire text -->
<button onclick="increaseText()">🔎 Mărire text</button>

<!-- Micșorare text -->
<button onclick="decreaseText()">🔎 Micșorare text</button>

<!-- Mod întunecat / lumină -->
<button id="themeToggle">🌙 Mod întunecat / lumină</button>

<!-- Citește textul -->
<button onclick="speakText()">🔊 Citește textul</button>

<!-- Buton instalare aplicație -->
<button id="installBtn" style="
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  background: #d4af37;
  color: black;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  display: none;
">
📥 Instalează aplicația
</button>

<p style="margin-top:20px; opacity:0.7;">Versiunea 1.0</p>

<!-- ========================= -->
<!-- SCRIPTURI FUNCȚIONALE     -->
<!-- ========================= -->

<script>
// 1. Mărire text
function increaseText() {
  let currentSize = parseFloat(getComputedStyle(document.body).fontSize);
  let newSize = currentSize + 2;
  document.body.style.fontSize = newSize + "px";
  localStorage.setItem("fontSize", newSize);
}

// 2. Micșorare text
function decreaseText() {
  let currentSize = parseFloat(getComputedStyle(document.body).fontSize);
  let newSize = currentSize - 2;
  document.body.style.fontSize = newSize + "px";
  localStorage.setItem("fontSize", newSize);
}

// 3. Text-to-Speech
function speakText() {
  const msg = new SpeechSynthesisUtterance("Bine ai venit în pagina de setări a aplicației duhovnicești.");
  msg.lang = "ro-RO";
  speechSynthesis.speak(msg);
}

// 4. Aplicare setări salvate
window.onload = function() {
  // Tema
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  // Dimensiune text
  if (localStorage.getItem("fontSize")) {
    document.body.style.fontSize = localStorage.getItem("fontSize") + "px";
  }
};

// 5. Dark Mode
const toggleBtn = document.getElementById("themeToggle");
toggleBtn.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");

  if (document.body.classList.contains("dark-mode")) {
    localStorage.setItem("theme", "dark");
  } else {
    localStorage.setItem("theme", "light");
  }
});

// 6. Instalare aplicație (PWA)
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = "none";
});
</script>

<!-- Bara de navigare -->
<div class="bottom-nav">
  <button onclick="location.href='index.html'" class="nav-btn">Acasă</button>
  <button onclick="location.href='calendar.html'" class="nav-btn">Calendar</button>
  <button onclick="location.href='rugaciuni.html'" class="nav-btn">Rugăciuni</button>
  <button onclick="location.href='setari.html'" class="nav-btn active">Setări</button>
</div>

<script src="nav.js"></script>

</body>
</html>
