<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setări – Hrana pentru suflet</title>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
  color: white;
}

/* Container principal */
.container {
  max-width: 600px;
  margin: 40px auto;
  padding: 20px;
}

/* Card premium */
.card {
  background: rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 20px;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

/* Titlu secțiune */
.card h2 {
  margin-top: 0;
  font-size: 22px;
  font-weight: 600;
  color: #ffd700;
}

/* Butoane premium */
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: linear-gradient(135deg, #ffd700, #b8860b);
  border: none;
  border-radius: 12px;
  color: black;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(255,215,0,0.4);
}

/* Link înapoi */
.back {
  text-align: center;
  margin-top: 30px;
  color: #ffd700;
  font-size: 16px;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h2>🔔 Notificări</h2>
    <p>Opțiune viitoare pentru remindere și alerte.</p>
  </div>

  <div class="card">
    <h2>🎨 Temă aplicație</h2>
    <p>Mod luminos / întunecat (în curând).</p>
  </div>

  <div class="card">
    <h2>📥 Actualizări</h2>
    <p>Aplicația se actualizează automat.</p>
  </div>

  <div class="card">
    <h2>⬇️ Descărcări</h2>
    <button class="btn">Descarcă versiunea Android (APK)</button>
    <button class="btn">Versiunea Web (Online)</button>
    <button class="btn">Instalează ca PWA</button>
  </div>

  <div class="card">
    <h2>🔊 Citire text</h2>
    <p>Voce naturală în mai multe limbi.</p>
    <button class="btn">Citește textul selectat</button>
  </div>

  <a class="back" href="index.html">⬅️ Înapoi la aplicație</a>

</div>

</body>
</html>
