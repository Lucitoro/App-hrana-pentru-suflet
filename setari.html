<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setări</title>
<link rel="stylesheet" href="style.css2?v=3">


<style>
/* ===== TITLURI PREMIUM ===== */
h1 {
  text-align: center;
  font-size: 28px;
  margin-top: 25px;
  margin-bottom: 25px;
  color: #d4af37;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(212,175,55,0.4);
}

/* ===== BUTOANE PREMIUM ===== */
.settings-btn {
  width: 90%;
  margin: 10px auto;
  display: block;
  padding: 15px;
  background: linear-gradient(135deg, #d4af37, #b8922a);
  color: black;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  box-shadow: 0 0 10px rgba(212,175,55,0.4);
  transition: 0.2s;
}

.settings-btn:active {
  transform: scale(0.97);
  box-shadow: 0 0 4px rgba(212,175,55,0.6);
}

/* ===== BUTON INSTALARE ===== */
#installBtn {
  display: none;
}

/* ===== DARK MODE PREMIUM ===== */
.dark-mode {
  background-color: #000 !important;
  color: #fff !important;
}

.dark-mode h1 {
  color: #d4af37 !important;
}

.dark-mode .settings-btn {
  background: #222 !important;
  color: #fff !important;
  border: 1px solid #444 !important;
  box-shadow: none !important;
}

.dark-mode .bottom-nav {
  background: #111 !important;
}

.dark-mode .bottom-nav button {
  color: #fff !important;
}
</style>
</head>

<body>

<h1>⚙️ SETĂRI APLICAȚIE</h1>

<button class="settings-btn" onclick="increaseText()">🔎 Mărire text</button>
<button class="settings-btn" onclick="decreaseText()">🔎 Micșorare text</button>
<button class="settings-btn" id="themeToggle">🌙 Mod întunecat / lumină</button>
<button class="settings-btn" onclick="speakText()">🔊 Citește textul</button>

<!-- BUTON INSTALARE APLICAȚIE -->
<button class="settings-btn" id="installBtn">📥 Instalează aplicația</button>

<p style="text-align:center; margin-top:20px; opacity:0.7;">Versiunea 1.0</p>

<script>
// ===== Mărire text =====
function increaseText() {
  let size = parseFloat(getComputedStyle(document.body).fontSize);
  size += 2;
  document.body.style.fontSize = size + "px";
  localStorage.setItem("fontSize", size);
}

// ===== Micșorare text =====
function decreaseText() {
  let size = parseFloat(getComputedStyle(document.body).fontSize);
  size -= 2;
  document.body.style.fontSize = size + "px";
  localStorage.setItem("fontSize", size);
}

// ===== Text to Speech =====
function speakText() {
  const msg = new SpeechSynthesisUtterance("Aceasta este pagina de setări a aplicației.");
  msg.lang = "ro-RO";
  speechSynthesis.speak(msg);
}

// ===== Aplicare setări salvate =====
window.onload = () => {
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }
  if (localStorage.getItem("fontSize")) {
    document.body.style.fontSize = localStorage.getItem("fontSize") + "px";
  }
};

// ===== Dark Mode =====
document.getElementById("themeToggle").addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");
  localStorage.setItem("theme",
    document.body.classList.contains("dark-mode") ? "dark" : "light"
  );
});

// ===== Instalare aplicație =====
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", async () => {
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = "none";
});
</script>

<!-- Bara de navigare -->
<div class="bottom-nav">
  <button onclick="location.href='index.html'" class="nav-btn">Acasă</button>
  <button onclick="location.href='calendar.html'" class="nav-btn">Calendar</button>
  <button onclick="location.href='rugaciuni.html'" class="nav-btn">Rugăciuni</button>
  <button onclick="location.href='setari.html'" class="nav-btn active">Setări</button>
</div>

<script src="nav.js"></script>

</body>
</html>
