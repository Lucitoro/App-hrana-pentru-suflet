<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setări</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

<header class="header-premium">
    <h1 class="title-green">⚙️ Setări</h1>
</header>

<main class="container">

    <!-- TEMA -->
    <div class="card3d settings-card">
        <h2 class="title-green">🎨 Tema aplicației</h2>
        <button class="btn-premium" onclick="setTheme('light')">Mod luminos</button>
        <button class="btn-premium" onclick="setTheme('dark')">Mod întunecat</button>
    </div>

    <!-- TTS -->
    <div class="card3d settings-card">
        <h2 class="title-green">🔊 Citire text (TTS)</h2>

        <button class="btn-premium" onclick="setVoice('male')">Voce masculină</button>
        <button class="btn-premium" onclick="setVoice('female')">Voce feminină</button>

        <button class="btn-premium" onclick="setRate(0.7)">Citire lentă</button>
        <button class="btn-premium" onclick="setRate(1)">Citire normală</button>
        <button class="btn-premium" onclick="setRate(1.3)">Citire rapidă</button>

        <button class="btn-premium" onclick="setReadMode('titles')">Citește doar titlurile</button>
        <button class="btn-premium" onclick="setReadMode('full')">Citește tot textul</button>
    </div>

    <!-- MĂRIME TEXT -->
    <div class="card3d settings-card">
        <h2 class="title-green">🔠 Mărime text</h2>
        <button class="btn-premium" onclick="setTextSize('small')">Mic</button>
        <button class="btn-premium" onclick="setTextSize('normal')">Normal</button>
        <button class="btn-premium" onclick="setTextSize('large')">Mare</button>
        <button class="btn-premium" onclick="setTextSize('xlarge')">Foarte mare</button>
    </div>

    <!-- LIMBA -->
    <div class="card3d settings-card">
        <h2 class="title-green">🌍 Limba aplicației</h2>
        <button class="btn-premium" onclick="setLanguage('ro')">Română</button>
        <button class="btn-premium" onclick="setLanguage('it')">Italiană</button>
        <button class="btn-premium" onclick="setLanguage('en')">Engleză</button>
    </div>

    <!-- GHID TEHNIC -->
    <div class="card3d settings-card">
        <h2 class="title-green">📘 Cum funcționează aplicația</h2>
        <a class="btn-premium" href="despre-tehnic.html">Deschide ghidul complet</a>
    </div>

    <!-- RESETARE -->
    <div class="card3d settings-card">
        <h2 class="title-green">♻️ Resetare setări</h2>
        <button class="btn-premium" onclick="resetSettings()">Resetează tot</button>
    </div>

</main>

<nav class="bottom-nav">
    <a href="index.html">🏠 Acasă</a>
    <a href="pravila.html">📘 Pravila</a>
    <a href="psaltirea.html">📖 Psaltirea</a>
    <a href="setari.html" class="active">⚙️ Setări</a>
</nav>

<script src="settings.js"></script>
<script src="settings-loader.js"></script>

</body>
</html>
