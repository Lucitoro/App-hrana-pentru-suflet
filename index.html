<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hrana pentru suflet</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  margin: 0;
  padding: 0;
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
  color: white;
}

.container {
  max-width: 600px;
  margin: 40px auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 28px;
  color: #ffd700;
  margin-bottom: 30px;
}

.card {
  background: rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 20px;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.btn {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: linear-gradient(135deg, #ffd700, #b8860b);
  border: none;
  border-radius: 12px;
  color: black;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(255,215,0,0.4);
}

.settings {
  text-align: center;
  margin-top: 30px;
  color: #ffd700;
  font-size: 16px;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

  <h1>Hrana pentru suflet</h1>

  <div class="card">

    <button class="btn" onclick="window.location.href='https://cartiduhovnicesti.blogspot.com/2025/03/calendarul-2026.html?m=1'">
      📅 Calendar 2026
    </button>

    <button class="btn" onclick="window.location.href='setari.html'">
      ⚙️ Setări aplicație
    </button>

    <button class="btn" onclick="window.location.href='https://lucitoro.github.io/App-hrana-pentru-suflet/'">
      📖 Deschide aplicația completă
    </button>

    <button class="btn" onclick="window.location.href='apk/Hrana-pentru-suflet.apk'">
      ⬇️ Descarcă versiunea Android (APK)
    </button>

  </div>

  <a class="settings" href="setari.html">➡️ Mergi la Setări</a>

</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
