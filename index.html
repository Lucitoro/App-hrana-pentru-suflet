<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hrana pentru suflet</title>

    <!-- Stil general -->
    <link rel="stylesheet" href="style.css">

    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json?v=20240419">

    <!-- ====== BUTON PLUTITOR PREMIUM ====== -->
    <style>
    .floating-tts {
        position: fixed;
        bottom: 25px;
        right: 25px;
        z-index: 99999;
    }

    .tts-main-btn {
        background: linear-gradient(135deg, #ffd700, #ffb300);
        border: none;
        padding: 18px 22px;
        border-radius: 50%;
        font-size: 26px;
        cursor: pointer;
        color: #000;
        font-weight: bold;
        box-shadow: 0 6px 18px rgba(0,0,0,0.35);
        transition: transform 0.2s ease;
    }
    .tts-main-btn:hover {
        transform: scale(1.1);
    }

    .tts-menu {
        display: none;
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 350px;

        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        border-radius: 18px;
        padding: 15px;
        border: 1px solid rgba(255, 215, 0, 0.4);
        box-shadow: 0 8px 25px rgba(0,0,0,0.35);

        animation: slideDown 0.25s ease-out;
    }

    @keyframes slideDown {
        from { opacity: 0; transform: translateY(15px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .tts-group-title {
        background: rgba(255, 215, 0, 0.35);
        border: 1px solid rgba(255, 215, 0, 0.6);
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        text-align: center;
        margin-bottom: 8px;
        color: #000;
        transition: 0.2s;
    }
    .tts-group-title:hover {
        background: rgba(255, 215, 0, 0.55);
    }

    .tts-group-content {
        display: none;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
    }

    .tts-btn {
        width: 100%;
        padding: 12px;
        background: rgba(255,255,255,0.35);
        border: 1px solid rgba(255,215,0,0.4);
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
        text-align: center;
        color: #000;
        font-weight: 500;
        transition: 0.2s;
    }
    .tts-btn:hover {
        background: rgba(255,255,255,0.55);
        transform: scale(1.03);
    }
    </style>
</head>

<body>

    <h1>Hrana pentru suflet</h1>
    <p>Bine ai venit în aplicația ta duhovnicească.</p>

    <!-- BUTON PLUTITOR PREMIUM -->
    <div class="floating-tts">
        <button class="tts-main-btn" onclick="toggleTTSMenu()">🔊</button>

        <div class="tts-menu" id="ttsMenu">

            <!-- GRUP 1: CITIRE -->
            <div class="tts-group">
                <div class="tts-group-title" onclick="toggleGroup('g1')">📖 Citire</div>
                <div class="tts-group-content" id="g1">
                    <button class="tts-btn" onclick="readPage()">Citește pagina</button>
                    <button class="tts-btn" onclick="readSelection()">Citește selecția</button>
                    <button class="tts-btn" onclick="readFromHere()">Citește de aici</button>
                    <button class="tts-btn" onclick="readTitles()">Citește titlurile</button>
                </div>
            </div>

            <!-- GRUP 2: CONTROL -->
            <div class="tts-group">
                <div class="tts-group-title" onclick="toggleGroup('g2')">🎛 Control</div>
                <div class="tts-group-content" id="g2">
                    <button class="tts-btn" onclick="pauseReading()">Pauză</button>
                    <button class="tts-btn" onclick="resumeReading()">Reia</button>
                    <button class="tts-btn" onclick="stopReading()">Stop</button>
                </div>
            </div>

            <!-- GRUP 3: SETĂRI -->
            <div class="tts-group">
                <div class="tts-group-title" onclick="toggleGroup('g3')">⚙️ Setări</div>
                <div class="tts-group-content" id="g3">
                    <button class="tts-btn" onclick="setVoice('female')">Voce feminină</button>
                    <button class="tts-btn" onclick="setVoice('male')">Voce masculină</button>
                    <button class="tts-btn" onclick="setRate(0.8)">Lent</button>
                    <button class="tts-btn" onclick="setRate(1)">Normal</button>
                    <button class="tts-btn" onclick="setRate(1.3)">Rapid</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Script TTS complet -->
    <script src="tts-full.js"></script>

    <!-- Script meniu premium -->
    <script>
    function toggleTTSMenu() {
        let menu = document.getElementById("ttsMenu");
        menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    function toggleGroup(id) {
        const groups = document.querySelectorAll(".tts-group-content");

        groups.forEach(g => {
            if (g.id === id) {
                g.style.display = (g.style.display === "flex") ? "none" : "flex";
            } else {
                g.style.display = "none";
            }
        });
    }
    </script>

</body>
</html>
