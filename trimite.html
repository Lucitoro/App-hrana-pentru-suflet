<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimite unui prieten</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

<main class="container">

    <h1 class="title-green">🤝 Trimite unui prieten</h1>

    <p style="color:#d8ffd8; font-size:18px; text-align:center; margin-bottom:25px;">
        Alege metoda preferată pentru a trimite aplicația „Hrana pentru suflet”.
    </p>

    <!-- WHATSAPP -->
    <a class="card3d btn-premium"
       href="whatsapp://send?text=Descarcă aplicația Hrana pentru suflet:%20https://lucitoro.github.io/App-hrana-pentru-suflet/">
       📲 Trimite pe WhatsApp
    </a>

    <!-- FACEBOOK MESSENGER -->
    <a class="card3d btn-premium"
       href="fb-messenger://share/?link=https://lucitoro.github.io/App-hrana-pentru-suflet/">
       💬 Trimite pe Messenger
    </a>

    <!-- TELEGRAM -->
    <a class="card3d btn-premium"
       href="https://t.me/share/url?url=https://lucitoro.github.io/App-hrana-pentru-suflet/&text=Descarcă aplicația Hrana pentru suflet">
       📡 Trimite pe Telegram
    </a>

    <!-- SMS -->
    <a class="card3d btn-premium"
       href="sms:?body=Descarcă aplicația Hrana pentru suflet:%20https://lucitoro.github.io/App-hrana-pentru-suflet/">
       ✉️ Trimite prin SMS
    </a>

    <!-- EMAIL -->
    <a class="card3d btn-premium"
       href="mailto:?subject=Hrana pentru suflet&body=Descarcă aplicația:%20https://lucitoro.github.io/App-hrana-pentru-suflet/">
       📧 Trimite prin Email
    </a>

    <!-- COPIERE LINK -->
    <button class="card3d btn-premium" onclick="copyLink()">
        🔗 Copiază linkul
    </button>

    <!-- SHARE UNIVERSAL -->
    <button class="card3d btn-premium" onclick="shareUniversal()">
        🌍 Distribuie (universal)
    </button>

    <p style="color:#ccc; font-size:16px; text-align:center; margin-top:30px;">
        Mulțumim că ajuți aplicația să ajungă la cât mai mulți oameni! 🙏
    </p>

</main>

<!-- SCRIPTURI GLOBALE -->
<script src="header.js"></script>
<script src="menu.js"></script>
<script src="settings-loader.js"></script>

<!-- SCRIPTURI FUNCȚIONALE -->
<script>
function copyLink() {
    navigator.clipboard.writeText("https://lucitoro.github.io/App-hrana-pentru-suflet/");
    alert("Link copiat!");
}

function shareUniversal() {
    if (navigator.share) {
        navigator.share({
            title: "Hrana pentru suflet",
            text: "Descarcă aplicația Hrana pentru suflet",
            url: "https://lucitoro.github.io/App-hrana-pentru-suflet/"
        });
    } else {
        alert("Funcția de distribuire nu este suportată pe acest dispozitiv.");
    }
}
</script>

</body>
</html>
